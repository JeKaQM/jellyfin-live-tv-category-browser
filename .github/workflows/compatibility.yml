name: Compatibility checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  support-declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Detect a new stable Server or Web release requiring review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-stable-support.mjs

  matrix:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.matrix.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "servers=$(node scripts/compatibility-matrix.mjs)" >> "$GITHUB_OUTPUT"

  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Project and independent browser tests
        run: |
          npm ci
          npm test
          npm run check
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Prepare checked Web integration
        run: bash scripts/prepare-jellyfin-web.sh
      - name: Resolve the declared Web source
        id: web-source
        run: echo "directory=build/jellyfin-web-$(node -p "JSON.parse(require('fs').readFileSync('web/compatibility.json','utf8')).releaseLine")" >> "$GITHUB_OUTPUT"
      - name: Validate and build integrated Web
        working-directory: ${{ steps.web-source.outputs.directory }}
        run: |
          npm ci
          npm run build:check
          npm run test
          npm run lint
          npm run stylelint
          npm run build:production
          npm run escheck
      - name: Stamp the compiled Web identity and asset hashes
        env:
          WEB_SOURCE: ${{ steps.web-source.outputs.directory }}
        run: node scripts/web-build-identity.mjs stamp "$WEB_SOURCE" "$WEB_SOURCE/dist"
      - name: Build the single minimum-ABI backend
        env:
          WEB_SOURCE: ${{ steps.web-source.outputs.directory }}
        run: |
          bash scripts/build-plugin.sh
          mkdir -p artifacts/plugin/web
          cp -a "$WEB_SOURCE/dist/." artifacts/plugin/web/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-runtime
          path: artifacts/plugin/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7

  real-server:
    needs: [matrix, web-and-backend]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.servers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-runtime
          path: artifacts/plugin
      - name: Install browser test runner
        run: |
          npm ci
          npx playwright install chromium
      - name: Same DLL on a real Jellyfin server and browser
        shell: pwsh
        run: ./scripts/smoke-server.ps1 -ServerVersion '${{ matrix.serverVersion }}' -BasePath '${{ matrix.basePath }}'
