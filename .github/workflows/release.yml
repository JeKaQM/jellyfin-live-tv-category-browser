name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Directory.Build.props").getroot().findtext(".//Version"))')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, got $GITHUB_REF_NAME"; exit 1; }

      - name: Test source and release scripts
        run: |
          npm test
          npm run check

      - name: Prepare Jellyfin Web overlay
        run: |
          chmod +x scripts/prepare-jellyfin-web.sh
          ./scripts/prepare-jellyfin-web.sh

      - name: Validate and build Jellyfin Web overlay
        working-directory: build/jellyfin-web-12.1
        run: |
          npm ci
          npm run build:check
          npm run test
          npm run lint
          npm run stylelint
          npm run build:production
          npm run escheck

      - name: Test and build server plugin
        run: |
          chmod +x scripts/build-plugin.sh
          ./scripts/build-plugin.sh

      - name: Build catalog package
        env:
          PLUGIN_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          chmod +x scripts/build-catalog.sh
          ./scripts/build-catalog.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/catalog/* --generate-notes --verify-tag
