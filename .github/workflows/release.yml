name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Directory.Build.props").getroot().findtext(".//Version"))')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, got $GITHUB_REF_NAME"; exit 1; }

      - name: Download the exact runtime already tested on every server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-runtime
          path: artifacts/plugin

      - name: Build catalog package
        env:
          PLUGIN_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          JELLYFIN_WEB_DIST: artifacts/plugin/web
        run: |
          bash scripts/build-catalog.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/catalog/* --notes-file docs/release-notes.md --verify-tag
