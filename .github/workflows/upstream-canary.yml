name: Upcoming Jellyfin Web compatibility

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - name: Check minimal patches and feature behavior against upstream master
        run: |
          npm ci
          npm run test:upstream
      # This workflow never publishes or expands the supported-version manifest.
