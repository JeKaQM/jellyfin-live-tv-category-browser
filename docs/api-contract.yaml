openapi: 3.0.3
info:
  title: Jellyfin Live TV Categories
  version: 0.9.0.1
  description: >-
    Category contract version 1. One minimum-12.0 ABI DLL is runtime-tested on
    Jellyfin 12.0, 12.1, 12.2, 12.3 and 12.4. Bundled Web 12.4 integration is
    enabled by default only on tested Servers 12.2, 12.3 and 12.4. An explicit
    administrator override can permit untested versions without changing
    tested support or guaranteeing future server compatibility.
paths:
  /LiveTvCategories:
    get:
      summary: List Live TV category summaries
      security:
        - jellyfinAuth: []
      responses:
        '200':
          description: Dynamic categories derived from the current tuner channel cache.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveTvCategory'
        '400':
          description: A userId is required for administrator API-key authentication.
        '401':
          description: Authentication required.
        '403':
          description: The user does not have Live TV access.
        '404':
          description: The requested API-key user does not exist.
        '503':
          $ref: '#/components/responses/SourceUnavailable'
      parameters:
        - name: userId
          in: query
          description: Required only for administrator API-key smoke tests; normal user sessions are resolved from authentication.
          schema:
            type: string
            format: uuid
  /LiveTvCategories/{categoryId}/Channels:
    get:
      summary: Return one page of existing Jellyfin channels in a category
      security:
        - jellyfinAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - name: startIndex
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: userId
          in: query
          description: Required only for administrator API-key smoke tests; normal user sessions are resolved from authentication.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
        - name: addCurrentProgram
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: A page of standard Jellyfin BaseItemDto channel records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPage'
        '400':
          description: Invalid paging input or a missing API-key userId.
        '401':
          description: Authentication required.
        '403':
          description: The user does not have Live TV access or requested another user's data.
        '404':
          description: Unknown or expired category ID, or an API-key user that does not exist.
        '503':
          $ref: '#/components/responses/SourceUnavailable'
  /LiveTvCategories/Compatibility:
    get:
      summary: Report the stable category contract and tested integration state
      security:
        - jellyfinAuth: []
      responses:
        '200':
          description: Safe compatibility metadata; no provider or user data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
        '401':
          description: Authentication required.
        '403':
          description: Live TV access required.
  /LiveTvCategories/Diagnostics:
    get:
      summary: Report count-only source state to administrators
      security:
        - jellyfinAuth: []
      responses:
        '200':
          description: Source counts and state without URLs, credentials or exception details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
        '401':
          description: Authentication required.
        '403':
          description: Administrator elevation and Live TV access required.
components:
  responses:
    SourceUnavailable:
      description: All eligible tuner sources failed. Sanitized failure; retry later.
      headers:
        Retry-After:
          description: Recommended retry delay in seconds, currently 30.
          schema:
            type: integer
            example: 30
  securitySchemes:
    jellyfinAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use the full Jellyfin header value: MediaBrowser Token="<API key or session token>". Session clients may also include their Client, Device, DeviceId and Version metadata.'
  schemas:
    Compatibility:
      type: object
      required: [apiContractVersion, pluginVersion, serverVersion, apiBaselineVersion, compiledApiVersion, apiCompatibilityFamily, apiTestedServerVersions, apiServerVersionTested, adapter, adapterState, bundledWebEnabled, bundledWebSupportedServerVersions, features, bundledWebVersionOverrideEnabled, bundledWebVersionOverrideActive]
      properties:
        apiContractVersion:
          type: string
          example: '1'
        pluginVersion:
          type: string
        serverVersion:
          type: string
        apiBaselineVersion:
          type: string
          example: '12.0.0'
        compiledApiVersion:
          type: string
        apiCompatibilityFamily:
          type: string
          description: Informational family only; not a future-version guarantee.
          example: '12.x'
        apiTestedServerVersions:
          type: array
          items:
            type: string
        apiServerVersionTested:
          type: boolean
        adapter:
          type: string
        adapterState:
          type: string
        bundledWebEnabled:
          type: boolean
          description: Effective Web availability, including explicit override and required bundle presence.
        bundledWebVersionOverrideEnabled:
          type: boolean
          description: Saved administrator opt-in to bypass the Web server-version restriction; false by default.
        bundledWebVersionOverrideActive:
          type: boolean
          description: True only when the override is actually permitting an untested server with valid metadata and an available Web bundle. It does not declare that version tested.
        bundledWebSupportedServerVersions:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
    Diagnostics:
      type: object
      description: Count-only snapshot of the last tuner read, not a connectivity probe.
      required: [state, lastAttemptUtc, eligibleTunerCount, successfulTunerCount, failedTunerCount, matchedChannelCount, unmatchedChannelCount]
      properties:
        state:
          type: string
        lastAttemptUtc:
          type: string
          format: date-time
          nullable: true
        eligibleTunerCount:
          type: integer
        successfulTunerCount:
          type: integer
        failedTunerCount:
          type: integer
        matchedChannelCount:
          type: integer
        unmatchedChannelCount:
          type: integer
    LiveTvCategory:
      type: object
      required: [id, name, channelCount]
      properties:
        id:
          type: string
          description: Opaque deterministic ID; never the raw category name.
        name:
          type: string
        channelCount:
          type: integer
          minimum: 0
    ChannelPage:
      type: object
      required: [Items, StartIndex, TotalRecordCount]
      properties:
        Items:
          type: array
          items:
            type: object
            description: Standard Jellyfin BaseItemDto.
        StartIndex:
          type: integer
          minimum: 0
        TotalRecordCount:
          type: integer
          minimum: 0
